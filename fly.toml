# fly.toml app configuration file generated for gudmart on 2026-05-30T13:40:10+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# VITE_FIREBASE_* are also in fly.toml [build.args] and farmer-frontend/.env.production.
# Override at deploy time if needed:
#   fly deploy --build-arg VITE_FIREBASE_API_KEY=...
# Runtime secrets (MONGODB_URI, WHATSAPP_*, FIREBASE_SERVICE_ACCOUNT_JSON) use:
#   fly secrets set KEY=value

app = 'gudmart-app'
primary_region = 'sin'

[build]
  dockerfile = "Dockerfile"

  # Public Firebase web client config — duplicated in farmer-frontend/.env.production
  # so Docker builds always bake valid auth settings even without --build-arg.
  [build.args]
    VITE_FIREBASE_API_KEY = "AIzaSyC8F_Tb6_vxSrDfwFn-yj_9c9cuuAfkZAo"
    VITE_FIREBASE_AUTH_DOMAIN = "whatsapp-pwa-5e3e2.firebaseapp.com"
    VITE_FIREBASE_PROJECT_ID = "whatsapp-pwa-5e3e2"
    VITE_FIREBASE_STORAGE_BUCKET = "whatsapp-pwa-5e3e2.firebasestorage.app"
    VITE_FIREBASE_MESSAGING_SENDER_ID = "1098496980631"
    VITE_FIREBASE_APP_ID = "1:1098496980631:web:96a9e2c76ffa045f9e1bd2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
