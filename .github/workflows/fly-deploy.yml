# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            farmer-backend/package-lock.json
            farmer-frontend/package-lock.json
      # Backend tests (tests/unit/spaFallback.test.js) serve the built PWA shell
      # from farmer-frontend/dist, so it must exist before running npm test.
      - name: Build frontend
        working-directory: farmer-frontend
        run: |
          npm ci
          npm run build
      - name: Install backend dependencies
        working-directory: farmer-backend
        run: npm ci
      - name: Run backend tests
        working-directory: farmer-backend
        run: npm test

  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    needs: test
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
